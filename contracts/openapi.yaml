components:
  schemas:
    EntradaInicioSesionBody:
      additionalProperties: false
      properties:
        clave:
          examples:
            - demo
          maxLength: 128
          minLength: 1
          type: string
        correo:
          examples:
            - operador@base-tecnica.test
          format: email
          maxLength: 254
          type: string
      required:
        - correo
        - clave
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    RespuestaSaludBody:
      additionalProperties: false
      properties:
        estado:
          description: Siempre "ok" cuando la respuesta es 200
          examples:
            - ok
          type: string
      required:
        - estado
      type: object
    Sesion:
      additionalProperties: false
      properties:
        correo:
          format: email
          type: string
        id:
          format: uuid
          type: string
        permisos:
          items:
            type: string
          type: array
        rol:
          type: string
      required:
        - id
        - correo
        - rol
        - permisos
      type: object
info:
  title: Base técnica · Grupo 6
  version: dev
openapi: 3.1.0
paths:
  /api/sesiones:
    delete:
      operationId: cerrar-sesion
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cierra la sesión
      tags:
        - Sesiones
    post:
      operationId: iniciar-sesion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaInicioSesionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Inicia una sesión
      tags:
        - Sesiones
  /api/sesiones/actual:
    get:
      operationId: consultar-sesion-actual
      parameters:
        - in: cookie
          name: sesion
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Consulta la sesión actual
      tags:
        - Sesiones
  /healthz:
    get:
      operationId: revisar-vida
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Indica si el proceso está vivo
      tags:
        - Salud
  /readyz:
    get:
      operationId: revisar-disponibilidad
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: "Indica si el servicio puede atender: responde 200 solo si PostgreSQL contesta"
      tags:
        - Salud
